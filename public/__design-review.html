<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReelBot responsive review</title><style>body{margin:0;background:#222;color:white;font:14px system-ui}nav{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{padding:8px}iframe{display:block;border:0;background:#090d12;height:1000px;max-width:none}main{overflow:auto}</style></head><body><nav><label>Page <select id="route"><option value="/">Home</option><option value="/browse">Browse</option><option value="/collections">Collections</option><option value="/collections/movies-like-heat">Heat collection</option><option value="/my-movies">My movies</option><option value="/reset-password">Reset password</option></select></label><button data-width="390">Phone 390</button><button data-width="768">Fold/tablet 768</button><button data-width="1024">Tablet 1024</button><button data-width="1280">Desktop 1280</button><span id="size">390px</span></nav><main><iframe id="site" title="ReelBot responsive preview" width="390" src="/"></iframe></main><script>const site=document.getElementById('site');document.getElementById('route').onchange=e=>site.src=e.target.value;document.querySelectorAll('button').forEach(b=>b.onclick=()=>{site.width=b.dataset.width;document.getElementById('size').textContent=b.dataset.width+'px'});</script></body></html>
